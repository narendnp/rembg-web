<!DOCTYPE html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rembg | Background Remover</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>
  <body class="min-h-screen bg-bg dark:bg-bg-dark font-sans text-ink dark:text-ink-dark antialiased">
    <!-- Subtle page gradient -->
    <div
      class="pointer-events-none fixed inset-0 -z-10 bg-gradient-to-b from-transparent to-surface-2/50 dark:to-surface-dark/30"
    ></div>

    <div class="mx-auto max-w-6xl px-4">
      <!-- Sticky blurred header -->
      <header
        class="sticky top-0 z-40 -mx-4 mb-6 border-b border-border/60 bg-bg/70 px-4 py-3 backdrop-blur-lg dark:border-border-dark/60 dark:bg-bg-dark/70"
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div
              class="flex h-9 w-9 items-center justify-center rounded-lg bg-accent text-white dark:bg-accent-dark"
            >
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                />
              </svg>
            </div>
            <h1 class="text-lg font-semibold tracking-tight">
              rembg <span class="text-ink-muted dark:text-ink-muted-dark font-normal">/ Background Remover</span>
            </h1>
          </div>
          <div class="flex items-center gap-1.5">
            <a
              href="https://x.com/narendnp_"
              target="_blank"
              rel="noopener noreferrer"
              class="flex h-9 w-9 items-center justify-center rounded-lg text-ink-muted hover:bg-surface-2 hover:text-ink dark:text-ink-muted-dark dark:hover:bg-surface-dark-2 dark:hover:text-ink-dark transition-colors"
              title="Twitter Profile"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
                />
              </svg>
            </a>
            <a
              href="https://github.com/narendnp/rembg-web"
              target="_blank"
              rel="noopener noreferrer"
              class="flex h-9 w-9 items-center justify-center rounded-lg text-ink-muted hover:bg-surface-2 hover:text-ink dark:text-ink-muted-dark dark:hover:bg-surface-dark-2 dark:hover:text-ink-dark transition-colors"
              title="GitHub Repository"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill-rule="evenodd"
                  d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.168 6.839 9.49.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.031-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.03 1.595 1.03 2.688 0 3.848-2.338 4.695-4.566 4.942.359.308.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.001 10.001 0 0022 12c0-5.523-4.477-10-10-10z"
                  clip-rule="evenodd"
                />
              </svg>
            </a>
            <button
              onclick="toggleDarkMode()"
              class="flex h-9 w-9 items-center justify-center rounded-lg text-ink-muted hover:bg-surface-2 hover:text-ink dark:text-ink-muted-dark dark:hover:bg-surface-dark-2 dark:hover:text-ink-dark transition-colors"
              title="Toggle theme"
            >
              <!-- Moon icon (shown in light mode) -->
              <svg id="iconMoon" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                />
              </svg>
              <!-- Sun icon (shown in dark mode) -->
              <svg id="iconSun" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Toolbar card -->
      <section class="card mb-4 p-4">
        <div class="flex flex-wrap items-center gap-3">
          <!-- Model select -->
          <div class="flex flex-1 items-center gap-2 min-w-[240px]">
            <label for="modelSelect" class="shrink-0 text-sm font-medium text-ink-muted dark:text-ink-muted-dark">
              Model
            </label>
            <div class="relative flex-1">
              <select
                id="modelSelect"
                onchange="updateModelDescription()"
                class="w-full appearance-none rounded-lg border border-border bg-surface px-3 py-2 pr-9 text-sm text-ink focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent dark:border-border-dark dark:bg-surface-dark dark:text-ink-dark dark:focus:border-accent-dark dark:focus:ring-accent-dark transition-colors"
              >
                <!-- Options populated dynamically -->
              </select>
              <svg
                class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-muted dark:text-ink-muted-dark"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-2">
            <button onclick="resetAll()" class="btn-outline" title="Reset everything">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                />
              </svg>
              Reset
            </button>
            <button onclick="processImage()" class="btn-primary" id="processButton" disabled>
              <svg id="processIcon" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"
                />
              </svg>
              <svg id="processSpinner" class="hidden h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              Process
            </button>
          </div>

          <!-- Quick toggle -->
          <div class="flex items-center gap-2 rounded-lg bg-surface-2 px-3 py-1.5 dark:bg-surface-dark-2">
            <label class="relative inline-flex cursor-pointer items-center">
              <input type="checkbox" id="quickConvertToggle" class="peer sr-only" onchange="toggleQuickConvert()" />
              <div
                class="h-5 w-9 rounded-full bg-border transition-colors peer-checked:bg-accent peer-focus:ring-2 peer-focus:ring-accent peer-focus:ring-offset-2 peer-focus:ring-offset-bg dark:peer-focus:ring-offset-bg-dark after:absolute after:left-[2px] after:top-[2px] after:h-4 after:w-4 after:rounded-full after:bg-white after:transition-transform peer-checked:after:translate-x-4 dark:bg-border-dark dark:peer-checked:bg-accent-dark"
              ></div>
            </label>
            <span class="text-sm font-medium">Quick</span>
            <div class="group relative">
              <span class="cursor-help text-ink-muted dark:text-ink-muted-dark">?</span>
              <div
                class="pointer-events-none absolute bottom-full left-1/2 mb-2 hidden -translate-x-1/2 w-48 rounded-lg bg-ink p-2 text-center text-xs font-medium text-white dark:bg-ink-dark dark:text-ink group-hover:block"
              >
                Automatically process image after upload
              </div>
            </div>
          </div>
        </div>

        <!-- Model description (slim muted text) -->
        <p id="modelDescription" class="mt-3 text-sm text-ink-muted dark:text-ink-muted-dark">
          Select a model to see its description
        </p>
      </section>

      <!-- Main split: input / output -->
      <div class="flex flex-col gap-4 lg:flex-row lg:h-[70vh]">
        <!-- Left: dropzone -->
        <div
          class="card flex h-96 w-full flex-col p-4 lg:h-full lg:w-1/2"
          id="dropZone"
          ondrop="dropHandler(event)"
          ondragover="dragOverHandler(event)"
          ondragleave="dragLeaveHandler(event)"
        >
          <input type="file" id="fileInput" class="hidden" accept="image/png,image/jpeg,image/webp" />
          <div
            id="dropBorder"
            class="flex h-full flex-col items-center justify-center gap-4 rounded-lg border-2 border-dashed border-border transition-colors dark:border-border-dark"
          >
            <div id="previewContainer" class="hidden flex h-full w-full items-center justify-center">
              <img id="previewImage" class="max-h-full max-w-full object-contain" />
            </div>
            <div id="uploadPrompt" class="p-8 text-center">
              <label for="fileInput" class="cursor-pointer">
                <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-surface-2 text-ink-muted dark:bg-surface-dark-2 dark:text-ink-muted-dark">
                  <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                    />
                  </svg>
                </div>
                <p class="mb-1.5 text-base font-medium">Drop your image here, or click to select</p>
                <p class="text-sm text-ink-muted dark:text-ink-muted-dark">
                  You can also paste
                  <span class="kbd ml-0.5">Ctrl/⌘ + V</span>
                  an image directly
                </p>
              </label>
            </div>
          </div>
        </div>

        <!-- Right: output -->
        <div class="card flex h-96 w-full flex-col p-4 lg:h-full lg:w-1/2">
          <div class="relative flex-1 overflow-hidden rounded-lg border border-border dark:border-border-dark">
            <!-- Empty state -->
            <div
              id="outputEmpty"
              class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-ink-muted dark:text-ink-muted-dark"
            >
              <svg class="h-10 w-10 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
              <p class="text-sm">Processed image will appear here</p>
            </div>

            <!-- Comparison slider -->
            <div id="sliderContainer" class="absolute inset-0 hidden select-none">
              <!-- Original image (bottom layer, full visible) -->
              <img id="sliderOriginal" class="pointer-events-none h-full w-full object-contain" />
              <!-- Result image (top layer, clipped by slider position) -->
              <img id="sliderResult" class="pointer-events-none h-full w-full object-contain" style="clip-path: inset(0 0 0 50%);" />
              <!-- Slider handle -->
              <div
                id="sliderHandle"
                class="absolute top-0 bottom-0 z-10 flex w-1 cursor-ew-resize items-center justify-center bg-white/80 shadow-lg"
                style="left: 50%;"
              >
                <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white shadow-md">
                  <svg class="h-4 w-4 text-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7l-5 5 5 5M16 7l5 5-5 5" />
                  </svg>
                </div>
              </div>
              <!-- Labels -->
              <span class="absolute left-2 top-2 rounded bg-black/60 px-2 py-0.5 text-xs font-medium text-white backdrop-blur">Original</span>
              <span class="absolute right-2 top-2 rounded bg-black/60 px-2 py-0.5 text-xs font-medium text-white backdrop-blur">Result</span>
            </div>

            <!-- Loading overlay -->
            <div
              id="loadingIndicator"
              class="hidden absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm"
            >
              <div class="flex flex-col items-center gap-3">
                <div class="h-10 w-10 animate-spin rounded-full border-4 border-white/30 border-t-white"></div>
                <p class="text-sm font-medium text-white">Processing…</p>
              </div>
            </div>

            <!-- Action buttons -->
            <div class="absolute right-2 top-2 z-20 flex gap-2">
              <button
                onclick="toggleSlider()"
                id="sliderToggleButton"
                class="hidden flex items-center gap-1.5 rounded-lg bg-surface/80 px-3 py-1.5 text-sm font-medium shadow-lg backdrop-blur transition-colors hover:bg-surface dark:bg-surface-dark/80 dark:hover:bg-surface-dark"
                title="Toggle comparison slider"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7l-5 5 5 5M16 7l5 5-5 5" />
                </svg>
                <span>Compare</span>
              </button>
              <button
                onclick="copyResult()"
                id="copyButton"
                class="hidden flex items-center gap-1.5 rounded-lg bg-surface/80 px-3 py-1.5 text-sm font-medium shadow-lg backdrop-blur transition-colors hover:bg-surface dark:bg-surface-dark/80 dark:hover:bg-surface-dark"
              >
                <span>Copy</span>
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                  />
                </svg>
              </button>
              <button
                onclick="downloadResult()"
                id="downloadButton"
                class="hidden flex items-center gap-1.5 rounded-lg bg-accent/90 px-3 py-1.5 text-sm font-medium text-white shadow-lg backdrop-blur transition-colors hover:bg-accent dark:bg-accent-dark/90 dark:hover:bg-accent-dark"
              >
                <span>Download</span>
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="mt-6 flex items-center justify-end py-4 text-xs text-ink-muted dark:text-ink-muted-dark">
        <a
          href="https://github.com/narendnp/rembg-web"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-ink dark:hover:text-ink-dark transition-colors"
        >
          v2
        </a>
      </footer>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="pointer-events-none fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script src="/static/main.js"></script>
  </body>
</html>
